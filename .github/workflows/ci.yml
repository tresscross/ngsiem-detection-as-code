# Lint + test the framework itself. No Falcon credentials needed.
# The full validate/plan/apply/drift pipeline lives in .gitlab-ci.yml.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .[dev]
      - name: Validate example rule
        run: python scripts/validate_rules.py --rules-dir examples
      - run: pytest -q
