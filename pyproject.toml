[project]
name = "ngsiem-detection-as-code"
version = "0.1.0"
description = "Detection-as-code for CrowdStrike NG-SIEM correlation rules"
requires-python = ">=3.11"
dependencies = [
    "crowdstrike-falconpy>=1.4.8",
    "ruamel.yaml>=0.18.6",
    "pyyaml>=6.0.1",
    "jsonschema>=4.21.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]
